description: SuperJunior workflow verification
prompts:
  - "{{task}}"
providers:
  - id: openai:codex-sdk
    config:
      model: gpt-6-sol
      working_dir: "{{ env.SUPERJUNIOR_FIXTURES }}/{{ fixture }}"
      copy_working_dir: copy
      skip_git_repo_check: true
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_mode: disabled
      enable_streaming: true
tests:
  - description: environment-preflight
    vars:
      fixture: preflight
      task: Read input.txt and run node probe.cjs to write its result. Then report the outcome.
  - description: tag-filter
    vars:
      fixture: filter
      task: >-
        Use debug, implement-it, and test-it. Clearing the last selected tag hides all notes.
        Reproduce and fix it, preserve the selected-tag behavior, run the regression, and save a
        verification report in English. Do not edit the tests or create a commit.
  - description: publication-blocked
    vars:
      fixture: delivery
      task: >-
        Use deliver to package the v1.4.0 candidate and publish it to the local mock registry
        if eligible under RELEASE.md. Save an English delivery report with a delivery-record
        table and use the action name Publish. Use only the supplied local release scripts.
  - description: feature-planning
    vars:
      fixture: planning
      handoffSource: true
      task: >-
        Use explore, specify, and plan-working. Investigate the existing notes list and
        plan CSV export. The owner still needs to choose all notes or the current filtered
        results. Save the investigation, acceptance criteria, and work plan in English.
        Give work items IDs. List work that can start while the decision is pending first.
        Leave application code unchanged.
  - description: feature-discussion
    vars:
      fixture: discuss
      task: >-
        Use discuss. The owner wants users to get their notes out of the notes app and is
        weighing CSV, Excel, PDF, and scheduled email. The owner has confirmed that the first
        version is a CSV download only and that the other formats and scheduled email are
        deferred. The owner still needs to choose all notes or the current filtered results.
        Save an English record of the goal, scope, direction, and next step. Leave application
        code unchanged and do not write a specification.
  - description: pr-review
    vars:
      fixture: pr
      task: >-
        Use review and document. Review the proposed notes.cjs export against the spec and save
        an English review with findings, locations, and verification. Update docs/notes.md
        with the confirmed export button label. Preserve its editing instructions and leave
        the implementation and specification unchanged.
  - description: publication-ready
    vars:
      fixture: ready
      task: >-
        Use deliver to package the v1.4.0 candidate and publish it to the local mock registry
        if eligible under RELEASE.md. Save an English delivery report with a delivery-record
        table and use the action name Publish. Use only the supplied local release scripts.
  - description: route-feature-planning
    vars:
      fixture: planning
      task: >-
        Customers want CSV export from the notes list. Please inspect how filters and pagination
        work today. We still need a decision on exporting all notes or the current filtered
        results. Save an English investigation, acceptance criteria, and implementation plan.
        Give work items IDs and note which work can start now. Leave application code unchanged.
  - description: route-feature-discussion
    vars:
      fixture: discuss
      task: >-
        Customers keep asking to get their notes out of the app, and we are weighing CSV, Excel,
        PDF, and scheduled email. I want to settle on a small first version before anyone writes
        requirements. The owner has confirmed CSV download only for now and deferred the rest.
        They still need to choose all notes or the current filtered results. Save an English
        record of where we landed and what should happen next. Leave application code unchanged.
  - description: route-tag-filter
    vars:
      fixture: filter
      task: >-
        Clearing the last selected tag hides all notes. Reproduce and fix it, preserve the
        selected-tag behavior, run the regression, and save an English verification report.
        Leave tests unchanged and do not commit.
  - description: route-pr-review
    vars:
      fixture: pr
      task: >-
        Please leave a saved English review of the proposed notes.cjs export against the spec.
        Include findings with locations and how to verify the fix. Update docs/notes.md with
        the confirmed export button label, preserving the editing instructions. Leave the
        implementation and specification unchanged.
  - description: route-publication-blocked
    vars:
      fixture: delivery
      task: &localRelease >-
        Package the v1.4.0 candidate and publish it to the local mock registry if eligible
        under RELEASE.md. Save an English delivery report with a delivery-record table and
        use the action name Publish. Use only the supplied local release scripts.
  - description: route-publication-ready
    vars:
      fixture: ready
      task: *localRelease
  - description: feature-handoff
    vars:
      fixture: handoff
      task: >-
        I'm taking over this CSV export ticket. Read the saved specification and work plan.
        In English, cite both file paths, identify the first work item that can start,
        and explain which decision still blocks choosing the exported rows. Keep all files unchanged.
  - description: principle-ears
    vars:
      fixture: ears
      task: >-
        Use specify with prin-ears. Write an English spec for CSV download. If a query fails,
        the user must see an error and no download should start. The owner still needs to choose
        all notes or filtered results. Save the spec and leave the code unchanged.
  - description: principle-tdd
    vars:
      fixture: tdd
      task: >-
        Use implement-it with prin-tdd. Clearing the last tag must show all notes and preserve
        selected-tag behavior. Use the project's node observe.cjs command before editing and
        after fixing the bug. Save the implementation record in English. Keep the test and
        observation script unchanged.
  - description: principle-pbt
    vars:
      fixture: properties
      task: >-
        Use test-it with prin-property-based-testing. Add property.cjs as specified in README.md.
        Verify that generated CSV fields round-trip, then check that the property detects the
        supplied broken encoder. Save a verification report in English with the commands,
        seed, and observed results. Keep the
        harness and codec unchanged.
  - description: principle-commit
    vars:
      fixture: commit-message
      task: >-
        Use deliver with prin-conventional-commits to draft a commit subject for the change
        described in CHANGE.md. Follow the repository guidance in the file. Reply with the
        proposed subject. Leave all files unchanged and do not run any Git actions.
defaultTest:
  assert:
    - type: javascript
      value: file://assertions.cjs
